name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.choose.outputs.mode }}
    steps:
      - id: choose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${{ github.repository }}"
          if gh api "repos/${REPO}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already exists"
            if gh api --method PUT "repos/${REPO}/pages" \
              -f build_type='legacy' \
              -f source[branch]='main' \
              -f source[path]='/'; then
              echo "mode=legacy" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if gh api --method POST "repos/${REPO}/pages" \
            -f build_type='legacy' \
            -f source[branch]='main' \
            -f source[path]='/'; then
            echo "Enabled branch deploy from main /"
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Branch deploy failed; switching to Actions."
          gh api --method POST "repos/${REPO}/pages" -f build_type='workflow' \
            || gh api --method PUT "repos/${REPO}/pages" -f build_type='workflow' \
            || true
          echo "mode=workflow" >> "$GITHUB_OUTPUT"

  deploy:
    needs: enable
    if: needs.enable.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
